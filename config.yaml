# ============================================================
# MEMECOIN COPYTRADER - PAPER TRADING CONFIGURATION
# ============================================================
# CRITICAL: This system operates ONLY in paper trading mode.
# No real funds, no real transactions, no real keys.
# ============================================================

# --- PAPER ACCOUNT ---
paper_account:
  name: "HERMES_PAPER_ACCOUNT_01"
  initial_balance_usd: 25.0
  mode: "paper_trading"
  use_real_funds: false
  send_real_transactions: false

# --- EXECUTION ---
execution:
  delay_ms: 200
  max_signal_age_ms: 800
  slippage_model: "linear"
  default_slippage_bps: 50
  min_position_usd: 2.0
  trading_fee_bps: 30
  priority_fee_sol: 0.0005

# --- RISK MANAGEMENT ---
risk:
  max_risk_per_trade_pct: 10.0
  max_total_exposure_pct: 100.0
  max_open_positions: 20
  max_trades_per_hour: 50
  max_slippage_bps: 500
  max_price_impact_bps: 1000
  min_liquidity_usd: 100.0
  max_gas_per_trade_usd: 0.01
  allow_leverage: false
  allow_short: false
  stop_loss_pct: 30.0
  trailing_take_profit_pct: 100.0

# --- WALLET DISCOVERY ---
wallet_discovery:
  max_wallets_to_copy: 10
  min_trades_per_wallet: 5
  min_win_rate_pct: 40.0
  min_profit_factor: 1.2
  max_single_token_profit_pct: 200.0
  rebalance_interval_hours: 4
  top_tokens_scan_count: 20
  top_traders_per_token: 50

# --- WALLET SCORING ---
wallet_scoring:
  weights:
    profit_consistency: 0.25
    diversification: 0.15
    temporal_pattern: 0.15
    position_sizing: 0.15
    wallet_age: 0.10
    relative_volume: 0.20
  min_score: 40
  bot_detection:
    max_trades_per_hour: 50
    identical_pattern_threshold: 0.95

# --- TOKEN SAFETY ---
token_safety:
  min_safety_score: 30
  max_top10_holders_pct: 80.0
  min_liquidity_usd: 100.0
  max_token_age_hours: 168
  require_mint_revoked: false
  require_freeze_revoked: false
  min_burned_liquidity_pct: 10.0

# --- API CONFIGURATION (READ-ONLY ONLY) ---
api:
  solana_rpc:
    url: "https://api.mainnet-beta.solana.com"
    timeout_seconds: 10
    max_retries: 3
  birdeye:
    base_url: "https://public-api.birdeye.so"
    api_key: ""
    rate_limit_per_second: 0.5
    cache_ttl_seconds: 5
  dexscreener:
    base_url: "https://api.dexscreener.com/latest/dex"
    rate_limit_per_second: 0.2
    cache_ttl_seconds: 30

# --- MONITORING ---
monitoring:
  poll_interval_seconds: 2
  health_check_interval_seconds: 30
  report_interval_hours: 1
  test_duration_hours: 72
  log_level: "DEBUG"
  kill_switch_check_seconds: 1
  graceful_shutdown_timeout_seconds: 5

# --- WEB DASHBOARD ---
web_dashboard:
  enabled: true
  host: "0.0.0.0"
  port: 8080
  auto_refresh_seconds: 5

# --- CHAINS ---
chains:
  primary: "solana"
  enabled:
    - "solana"

# --- OUTPUT ---
output:
  reports_dir: "reports"
  logs_dir: "logs"
  data_dir: "data"
